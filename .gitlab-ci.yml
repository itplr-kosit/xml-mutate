default:
  image: maven:3.8.3-openjdk-17

stages:
  - build
  - deploy
  - release

variables:
  MAVEN_CLI_OPTS: "--batch-mode -Dmaven.repo.local=repository -Dfile.encoding=UTF-8"
  XSE_COMPONENT_PROJECT_ID: "356"
  XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX: "${CI_API_V4_URL}/projects/${XSE_COMPONENT_PROJECT_ID}/packages/maven"

cache:
  paths:
    - repository

build-job:
  stage: build
  script:
    - |
      # On a tag build, drive ${revision} from the tag so the four
      # reactor modules publish at de.kosit:xml-mutate-*:$CI_COMMIT_TAG.
      REVISION_OVERRIDE=""
      if [ -n "$CI_COMMIT_TAG" ]; then
        REVISION_OVERRIDE="-Drevision=$CI_COMMIT_TAG"
      fi
    - echo "Building xml-mutate reactor ${REVISION_OVERRIDE}"
    - mvn $MAVEN_CLI_OPTS $REVISION_OVERRIDE verify
    - echo "Generating deployment metadata"
    - mkdir -p build
    - |
      GROUP_ID=$(mvn $REVISION_OVERRIDE help:evaluate -Dexpression=project.groupId -q -DforceStdout -N)
      PROJECT_VERSION=$(mvn $REVISION_OVERRIDE help:evaluate -Dexpression=project.version -q -DforceStdout -N)
      echo "GROUP_ID=${GROUP_ID}" > build/build.env
      echo "PACKAGE_VERSION=${PROJECT_VERSION}" >> build/build.env
    - cat build/build.env
  artifacts:
    name: xml-mutate-${CI_COMMIT_REF_NAME}
    paths:
      - "**/target/*.jar"
      - build/
    expire_in: 1 day
    reports:
      junit:
        - "**/target/surefire-reports/*.xml"
        - "**/target/failsafe-reports/*.xml"
      dotenv: build/build.env

deploy-to-xse-component-repository:
  stage: deploy
  image: maven:3.8.5-openjdk-17
  variables:
    REPO_ID: "xse-component-repository"
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build-job
  script:
    - echo "Deploying xml-mutate ${PACKAGE_VERSION} reactor artifacts to ${REPO_ID}"
    - |
      echo "<settings><servers><server><id>${REPO_ID}</id><configuration><httpHeaders><property><name>Job-Token</name><value>${CI_JOB_TOKEN}</value></property></httpHeaders></configuration></server></servers></settings>" > /tmp/settings.xml
    # Reactor deploy: parent pom + xml-mutate-{mutator,validator,runner,cli}
    # in one pass. flatten-maven-plugin resolves ${revision} into the
    # installed/deployed poms.
    - mvn $MAVEN_CLI_OPTS -Drevision=$CI_COMMIT_TAG -DskipTests deploy
      -DaltDeploymentRepository=${REPO_ID}::default::${XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX}
      --settings /tmp/settings.xml

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  dependencies:
    - build-job
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG with version ${PACKAGE_VERSION}"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'xml-mutate release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'xml-mutate-cli (executable fat JAR)'
          url: '${XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX}/de/kosit/xml-mutate-cli/${PACKAGE_VERSION}/xml-mutate-cli-${PACKAGE_VERSION}.jar'
          link_type: 'package'
        - name: 'xml-mutate-mutator (library)'
          url: '${XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX}/de/kosit/xml-mutate-mutator/${PACKAGE_VERSION}/xml-mutate-mutator-${PACKAGE_VERSION}.jar'
          link_type: 'package'
        - name: 'xml-mutate-validator (library)'
          url: '${XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX}/de/kosit/xml-mutate-validator/${PACKAGE_VERSION}/xml-mutate-validator-${PACKAGE_VERSION}.jar'
          link_type: 'package'
        - name: 'xml-mutate-runner (library)'
          url: '${XSE_COMPONENT_PACKAGE_REGISTRY_URL_PREFIX}/de/kosit/xml-mutate-runner/${PACKAGE_VERSION}/xml-mutate-runner-${PACKAGE_VERSION}.jar'
          link_type: 'package'
